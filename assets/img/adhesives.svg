<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="adh-title adh-desc" preserveAspectRatio="xMidYMid slice">
  <title id="adh-title">Adhesive bond line cross-section with wetting meniscus and peel curve</title>
  <desc id="adh-desc">Abstract technical illustration of a bonded joint: upper and lower substrates, surface-treated interphase, adhesive bond line with fillet and entrapped void, contact-angle detail, and a peel force trace.</desc>

  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="ad-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v9" stroke="currentColor" stroke-opacity="0.3" stroke-width="2.5"/>
    </pattern>
    <linearGradient id="ad-glue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.42"/>
    </linearGradient>
    <!-- Punches the entrapped void out of the bond line rather than painting over it,
         so the figure background shows through under any theme. -->
    <mask id="ad-void">
      <rect x="0" y="140" width="800" height="80" fill="#fff"/>
      <ellipse cx="452" cy="178" rx="26" ry="13" fill="#000"/>
    </mask>
  </defs>

  <rect width="800" height="500" fill="url(#ad-bg)"/>

  <!-- Upper substrate -->
  <rect x="70" y="72" width="660" height="76" fill="url(#ad-hatch)"/>
  <rect x="70" y="72" width="660" height="76" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Interphase / primer -->
  <rect x="70" y="148" width="660" height="7" fill="currentColor" fill-opacity="0.7"/>

  <!-- Adhesive bond line with fillets -->
  <g mask="url(#ad-void)">
    <path d="M70 155h660v46H70z" fill="url(#ad-glue)"/>
    <path d="M70 155q -34 6 -40 23t 40 23z" fill="currentColor" fill-opacity="0.34"/>
    <path d="M730 155q 34 6 40 23t -40 23z" fill="currentColor" fill-opacity="0.34"/>
  </g>
  <!-- Entrapped void — the failure mode worth pointing at -->
  <ellipse cx="452" cy="178" rx="26" ry="13" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Filler particles -->
  <g fill="currentColor" fill-opacity="0.4">
    <circle cx="140" cy="172" r="4"/><circle cx="196" cy="186" r="3"/><circle cx="252" cy="170" r="5"/>
    <circle cx="312" cy="184" r="3.5"/><circle cx="368" cy="174" r="4"/><circle cx="536" cy="182" r="4.5"/>
    <circle cx="596" cy="170" r="3"/><circle cx="656" cy="184" r="4"/><circle cx="700" cy="172" r="3.5"/>
  </g>

  <!-- Lower substrate -->
  <rect x="70" y="201" width="660" height="7" fill="currentColor" fill-opacity="0.7"/>
  <rect x="70" y="208" width="660" height="76" fill="url(#ad-hatch)"/>
  <rect x="70" y="208" width="660" height="76" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Bond-line thickness callout -->
  <g stroke="currentColor" stroke-opacity="0.55" stroke-width="1">
    <path d="M752 155v46M746 155h12M746 201h12"/>
  </g>
  <text x="768" y="178" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.2" fill="currentColor" fill-opacity="0.6" transform="rotate(-90 768 178)" text-anchor="middle">0.20 mm</text>

  <!-- Labels -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.3" fill="currentColor" fill-opacity="0.55" text-anchor="end">
    <text x="58" y="116">SUBSTRATE</text>
    <text x="58" y="182">BOND LINE</text>
    <text x="58" y="252">SUBSTRATE</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="1">
    <path d="M452 165V118h56"/>
  </g>
  <text x="514" y="122" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="currentColor" fill-opacity="0.6">VOID</text>

  <!-- Contact angle detail -->
  <g transform="translate(96 328)">
    <path d="M0 74h190" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M28 74a68 68 0 0 1 116 0z" fill="currentColor" fill-opacity="0.24" stroke="currentColor" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M28 74a34 34 0 0 1 10 -24" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="48" y="62" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" fill="currentColor" fill-opacity="0.7">&#952; 34&#176;</text>
    <text x="0" y="106" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" letter-spacing="1.3" fill="currentColor" fill-opacity="0.5">WETTING</text>
  </g>

  <!-- Peel force trace -->
  <g transform="translate(340 328)">
    <path d="M0 74h390M0 74V0" stroke="currentColor" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M0 74 26 12l16 34 18-26 16 30 18-24 16 28 18-22 16 26 18-20 16 24 18-18 16 22 18-16 16 20 18-14 16 18 18-12 16 16 18-10 16 14 18 32"
          fill="none" stroke="currentColor" stroke-opacity="0.75" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0 26h390" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="0" y="-10" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.4" fill="currentColor" fill-opacity="0.55">T-PEEL FORCE &#183; N/mm</text>
  </g>
</svg>
