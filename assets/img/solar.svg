<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="pv-title pv-desc" preserveAspectRatio="xMidYMid slice">
  <title id="pv-title">Photovoltaic cell cross-section with metallisation and quantum efficiency curve</title>
  <desc id="pv-desc">Abstract technical illustration of a solar cell: incident light rays, front-contact fingers and busbar, textured emitter, p&#8211;n junction, rear passivation stack, and an external quantum efficiency response curve.</desc>

  <defs>
    <linearGradient id="pv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pv-emitter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="pv-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pv-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#pv-bg)"/>

  <!-- Incident irradiance -->
  <g stroke="url(#pv-ray)" stroke-width="1.5" stroke-linecap="round">
    <path d="M96 18v148M164 6v160M232 22v144M300 8v158M368 18v148M436 6v160M504 22v144M572 8v158M640 18v148M708 12v154"/>
  </g>
  <text x="40" y="40" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" letter-spacing="1.4" fill="currentColor" fill-opacity="0.55">AM1.5G</text>

  <!-- Textured front surface (pyramids) -->
  <path d="M60 196 84 172l24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24 24-24 24 24v10H60z"
        fill="currentColor" fill-opacity="0.42"/>

  <!-- Emitter (n+) -->
  <rect x="60" y="206" width="680" height="44" fill="url(#pv-emitter)"/>
  <!-- Base (p) -->
  <rect x="60" y="250" width="680" height="86" fill="url(#pv-base)"/>
  <!-- Junction line -->
  <path d="M60 250h680" stroke="currentColor" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- Rear passivation + local contacts -->
  <rect x="60" y="336" width="680" height="12" fill="currentColor" fill-opacity="0.30"/>
  <rect x="60" y="348" width="680" height="16" fill="currentColor" fill-opacity="0.55"/>
  <g fill="currentColor" fill-opacity="0.85">
    <rect x="120" y="332" width="16" height="20"/><rect x="248" y="332" width="16" height="20"/>
    <rect x="376" y="332" width="16" height="20"/><rect x="504" y="332" width="16" height="20"/>
    <rect x="632" y="332" width="16" height="20"/>
  </g>

  <!-- Front metallisation fingers + busbar -->
  <g fill="currentColor" fill-opacity="0.9">
    <rect x="140" y="166" width="7" height="42"/><rect x="236" y="166" width="7" height="42"/>
    <rect x="332" y="166" width="7" height="42"/><rect x="428" y="166" width="7" height="42"/>
    <rect x="524" y="166" width="7" height="42"/><rect x="620" y="166" width="7" height="42"/>
  </g>
  <rect x="60" y="156" width="680" height="10" fill="currentColor" fill-opacity="0.7"/>

  <!-- Carrier generation & separation -->
  <g stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" fill="none">
    <path d="M296 236v-46" marker-end="url(#pv-arrow)"/>
    <path d="M456 264v46" marker-end="url(#pv-arrow)"/>
  </g>
  <defs>
    <marker id="pv-arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
  </defs>
  <circle cx="296" cy="240" r="5" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M293 240h6" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.5"/>
  <circle cx="456" cy="260" r="5" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5"/>
  <path d="M453 260h6M456 257v6" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.5"/>

  <!-- EQE response curve -->
  <g transform="translate(60 392)">
    <path d="M0 68h680M0 68V0" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
    <path d="M0 60C 60 22 130 10 220 8s 210 2 300 12 120 34 160 46"
          fill="none" stroke="currentColor" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="-8" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.4" fill="currentColor" fill-opacity="0.55">EXTERNAL QUANTUM EFFICIENCY</text>
    <text x="680" y="86" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.2" fill="currentColor" fill-opacity="0.45">1200 nm</text>
    <text x="0" y="86" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.2" fill="currentColor" fill-opacity="0.45">300 nm</text>
  </g>
</svg>
